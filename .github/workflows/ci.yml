name: CI

# PR gate: fast and Verilator-free. Trace regeneration lives in nightly.yml.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (fmt / clippy / test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # Tests ingest the committed golden, load the committed FST + VCD traces
      # (Phase 0 round-trip), and run the Phase 1 matcher gate on both formats.
      - run: cargo test --all
      # Phase 1 go/no-go gate, enforced as a hard PR gate on both committed
      # traces (no Verilator needed). `svxprobe match` exits non-zero below 95%
      # or on any mystery miss.
      - name: Cross-probe gate (FST)
        run: >-
          cargo run --quiet --bin svxprobe -- match
          ../fixtures/picorv32_soc/golden/hierarchy.json
          ../fixtures/picorv32_soc/traces/picorv32_soc.fst
          --excluded ../fixtures/picorv32_soc/excluded_scopes.txt
      - name: Cross-probe gate (VCD)
        run: >-
          cargo run --quiet --bin svxprobe -- match
          ../fixtures/picorv32_soc/golden/hierarchy.json
          ../fixtures/picorv32_soc/traces/picorv32_soc.vcd
          --excluded ../fixtures/picorv32_soc/excluded_scopes.txt

  python:
    name: Python harness (lint / test / schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync deps
        working-directory: elaborate
        run: uv sync --frozen
      - name: Lint
        working-directory: elaborate
        run: uv run ruff check .
      - name: Test
        working-directory: elaborate
        run: uv run pytest -q
      # VCS rejects a variable written by always_ff that has any other procedural
      # driver (IEEE 1800 §9.2.2.4); slang/Verilator accept it, so this lint is
      # our only gate against reintroducing it (e.g. $readmemh + always_ff RAM).
      - name: Lint RTL for illegal always_ff driver combinations
        run: |
          uv run --project elaborate python -m svxprobe_elaborate.lint \
            --top picorv32_soc \
            fixtures/picorv32_soc/rtl/picorv32.v \
            fixtures/picorv32_soc/rtl/soc_pkg.sv \
            fixtures/picorv32_soc/rtl/mem_if.sv \
            fixtures/picorv32_soc/rtl/soc_mem.sv \
            fixtures/picorv32_soc/rtl/picorv32_soc.sv
      - name: Validate committed golden against schema
        working-directory: elaborate
        run: uv run python -m svxprobe_elaborate.validate ../fixtures/picorv32_soc/golden/hierarchy.json
      - name: Golden is reproducible from RTL (elaboration is deterministic)
        run: |
          uv run --project elaborate svxprobe-elaborate --top picorv32_soc \
            fixtures/picorv32_soc/rtl/picorv32.v \
            fixtures/picorv32_soc/rtl/soc_pkg.sv \
            fixtures/picorv32_soc/rtl/mem_if.sv \
            fixtures/picorv32_soc/rtl/soc_mem.sv \
            fixtures/picorv32_soc/rtl/picorv32_soc.sv \
            --gate-level \
            -o /tmp/golden_regen.json
          diff <(jq -S . fixtures/picorv32_soc/golden/hierarchy.json) \
               <(jq -S . /tmp/golden_regen.json) \
            || { echo "::error::golden/hierarchy.json is stale; re-run the harness and commit"; exit 1; }
