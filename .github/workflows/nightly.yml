name: Nightly

# Heavier checks that need Verilator and a real production core. Not a PR gate.
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily (off the :00 mark)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro-tier1:
    name: Tier-1 trace reproducibility (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Regenerates traces with Verilator and checks they are structurally
      # equivalent to the committed ones (validated locally; see the script).
      - name: Verify reproducible
        run: bash fixtures/verify_reproducible.sh picorv32_soc

  stress-tier2:
    name: Tier-2 stress (real core, experimental)
    runs-on: ubuntu-latest
    # Tier-2 is provisioned but not yet hardened end-to-end; do not fail the
    # nightly on it while it is being brought up. Tracked in docs/fixtures.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync harness deps
        working-directory: elaborate
        run: uv sync --frozen
      - name: Fetch pinned real core
        run: bash fixtures/ibex_soc/fetch.sh
      - name: Elaborate real core (stress the pyslang harness)
        run: bash fixtures/ibex_soc/elaborate.sh

  scale-bench:
    name: Scalability harness (smoke, non-blocking)
    runs-on: ubuntu-latest
    # Benchmarks are noisy and slow; never fail the nightly on perf variance.
    # This exercises the report path (665 + 100K) and a fast criterion sanity
    # pass end-to-end. The generator's validity is gated separately by
    # `cargo test --all` in ci.yml (tests/valid.rs).
    continue-on-error: true
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # One collector run covers all three layers: the memory/RSS scenarios
      # (#22/#155), a short criterion pass, and the single-shot report. No
      # --full: the 1M basis needs several GB and a hosted runner has ~7.
      - name: Build the collector
        run: cargo build --release -p scale-bench
      - name: Scalability metrics
        # --online: the collector defaults to --offline for the isolated-machine
        # case, which would fail here on a cold registry cache.
        run: ./target/release/collect --online --out "$GITHUB_WORKSPACE/scale-bench-metrics.md"
      # The metrics file is the artifact worth keeping — the numbers that gate
      # the #22 (redb-vs-SQLite) and #155 (zero-copy) decisions.
      - name: Upload metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scale-bench-metrics
          path: scale-bench-metrics.md
          if-no-files-found: warn

  nix-harness:
    name: Nix harness build (non-blocking)
    runs-on: ubuntu-latest
    # Deliberately NOT a `checks` entry, so `nix flake check` stays ~2.5 min on
    # every PR. The derivation builds slang from source — 21m22s measured on 8
    # cores, worse on a 4-core runner — and there is no binary cache, so gating
    # it per-PR would dominate the Rust gate it sits beside. The harness's own
    # correctness is already gated on every PR by ci.yml's `uv run pytest -q`;
    # what rots here is the *packaging* (a pyslang release, an fmt/pybind11 move
    # in nixpkgs), which a nightly catches soon enough. See #280.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The build runs the 97-test suite in its checkPhase.
      - name: Build the harness
        run: nix build .#svxprobe-elaborate -L
      # The acceptance criterion from ADR 0009: a packaged harness that does not
      # reproduce the committed golden byte-for-byte is a second dialect, not a
      # package. Guards against a pyslang upgrade silently changing the model.
      - name: Golden reproduces byte-for-byte
        run: |
          set -euo pipefail
          nix run .#svxprobe-elaborate -- --top picorv32_soc \
            fixtures/picorv32_soc/rtl/picorv32.v \
            fixtures/picorv32_soc/rtl/soc_pkg.sv \
            fixtures/picorv32_soc/rtl/mem_if.sv \
            fixtures/picorv32_soc/rtl/soc_mem.sv \
            fixtures/picorv32_soc/rtl/picorv32_soc.sv \
            --gate-level --name-refs -o /tmp/hierarchy.json
          cmp /tmp/hierarchy.json fixtures/picorv32_soc/golden/hierarchy.json

  nix-app:
    name: Nix desktop app build (non-blocking)
    runs-on: ubuntu-latest
    # Deliberately not a PR gate (ADR 0012): `app/**` is not in nix.yml's path
    # filter and this output is not in `checks`, so no PR pays for a webkit-linked
    # Tauri build in a repo with no binary cache. app.yml already gates the app
    # itself on every PR through `cargo build` and a real `tauri build`; what rots
    # here is the *packaging*. The failure modes are a stale npmDepsHash after
    # app/package-lock.json moves, a nixpkgs webkitgtk/gtk bump, and core/ path-dep
    # drift — none of which need same-PR feedback, but all of which a consumer
    # would hit before we did. See #279.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the app
        run: nix build .#hdl-schemview-app -L
      # Headless: a hosted runner has no display, and the GUI cannot be exercised
      # here. This proves the binary links and runs, and that the #275 rename held
      # (cargo emits hdl-schemview-app; the bundler's mainBinaryName does not apply
      # to a plain cargo build, so the derivation renames it itself).
      - name: Binary runs and carries the release name
        run: |
          set -euo pipefail
          test -x result/bin/hdl-schemview
          ./result/bin/hdl-schemview --bench --help | head -1
      # The wrapper is where a GUI packaging bug actually lands: `nix shell` sets
      # no GTK environment, so anything missing here is simply absent for a
      # consumer, and shows up as a blank window rather than a build failure.
      - name: Wrapper carries the GTK runtime environment
        run: |
          set -euo pipefail
          for v in XDG_DATA_DIRS GIO_EXTRA_MODULES GDK_PIXBUF_MODULE_FILE SVXPROBE_ELABORATE; do
            strings result/bin/hdl-schemview | grep -qx "$v" \
              || { echo "::error::wrapper is missing $v"; exit 1; }
          done

