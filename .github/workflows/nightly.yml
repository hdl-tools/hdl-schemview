name: Nightly

# Heavier checks that need Verilator and a real production core. Not a PR gate.
on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC daily (off the :00 mark)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro-tier1:
    name: Tier-1 trace reproducibility (Verilator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: core
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Regenerates traces with Verilator and checks they are structurally
      # equivalent to the committed ones (validated locally; see the script).
      - name: Verify reproducible
        run: bash fixtures/verify_reproducible.sh picorv32_soc

  stress-tier2:
    name: Tier-2 stress (real core, experimental)
    runs-on: ubuntu-latest
    # Tier-2 is provisioned but not yet hardened end-to-end; do not fail the
    # nightly on it while it is being brought up. Tracked in docs/fixtures.md.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync harness deps
        working-directory: elaborate
        run: uv sync --frozen
      - name: Fetch pinned real core
        run: bash fixtures/ibex_soc/fetch.sh
      - name: Elaborate real core (stress the pyslang harness)
        run: bash fixtures/ibex_soc/elaborate.sh

  scale-bench:
    name: Scalability harness (smoke, non-blocking)
    runs-on: ubuntu-latest
    # Benchmarks are noisy and slow; never fail the nightly on perf variance.
    # This exercises the report path (665 + 100K) and a fast criterion sanity
    # pass end-to-end. The generator's validity is gated separately by
    # `cargo test --all` in ci.yml (tests/valid.rs).
    continue-on-error: true
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # Single-shot report (665 golden + 665 synth + 100K synth); no --full (1M).
      - name: Scalability report
        run: cargo run -p scale-bench --release --bin report
      # Quick criterion sanity at the default sizes (1M skipped without
      # SCALE_BENCH_FULL); short warm-up/measurement to keep it fast.
      - name: Criterion smoke
        run: cargo bench -p scale-bench -- --warm-up-time 1 --measurement-time 3

