name: App

# Cross-platform build of the Tauri desktop app. Path-scoped so it only runs on
# PRs/pushes that touch the app or the crates it wraps (the repo is private, and
# the Windows runner bills at 2x minutes). The Windows leg exercises the
# tauri-build Windows Resource/icon embed — the thing a Linux box can't validate.
#
# A `v*` tag additionally drives the `release` job below (#248). The `paths`
# filter does NOT suppress that: GitHub does not evaluate path filters for
# pushes of tags (workflow-syntax reference). Do not "fix" this by splitting the
# trigger into a second workflow — duplicating the bundle matrix is the drift
# trap #246 documents.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", "core/crates/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "core/crates/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Desktop app build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash is present on the Windows runner, so the same run blocks work
        # on both OSes (no PowerShell line-continuation differences).
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Linux needs webkit/gtk; Windows ships WebView2 + Rust-MSVC preinstalled.
      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: core

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Frontend (install / test / build)
        working-directory: app
        run: |
          npm install
          npm test
          npm run build

      - name: Tauri shell (compile — exercises the Windows resource/icon embed)
        working-directory: app/src-tauri
        env:
          SVX_BUILD_REV: ${{ github.sha }}
        run: cargo build

      # The only automated exercise of the `--bench` self re-exec (#240 tier 1):
      # the parent spawns `current_exe() --bench-scenario` once per row, so this
      # fails if argv round-tripping ever breaks. `golden` is the embedded
      # fixture, so it needs nothing from the runner and takes seconds.
      - name: Benchmark self re-exec smoke
        working-directory: app/src-tauri
        run: |
          out="$RUNNER_TEMP/bench-smoke.md"
          ./target/debug/hdl-schemview-app --bench --bases golden --out "$out"
          grep -q 'Single-shot run' "$out"
          grep -q 'hdl-schemview --bench' "$out"

      # The lean product shape the issue asks for: no benchmark code compiled in,
      # and the launch arms refuse instead of opening a window.
      - name: Tauri shell (compile — no bench feature)
        working-directory: app/src-tauri
        run: cargo build --no-default-features

  # The bundle path (#240): `cargo build` above never exercises the bundler, so
  # NSIS/AppImage/.app packaging could break unnoticed until release. This job
  # actually bundles, on all three targets.
  #
  # Not on pull_request: macOS runners bill at 10x on a private repo, and a
  # full `tauri build` per PR is a poor trade for the fast `cargo build` signal
  # the `build` job already gives.
  bundle:
    name: Bundle (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Two distinct failures, both silent without this (#248):
      #
      #   1. tag != tauri.conf.json — the bundle FILENAMES come from that config,
      #      not the tag, so a v0.2.0 tag against a 0.1.0 config produces a
      #      release full of hdl-schemview_0.1.0_* assets. This one breaks the
      #      release.
      #   2. the three manifests disagree — cosmetic (nothing reads them for
      #      naming), but the repo then reports two versions of itself.
      #
      # Both are reported in one run so a maintainer fixes them in one pass.
      # Checked as a step rather than a `needs:`-ed job because a job skipped by
      # its own `if:` skips everything downstream too; as the first step after
      # checkout it still aborts all three legs — incl. the 10x-billed macOS one
      # — within seconds. `^version = ` is anchored on purpose: the dependency
      # versions in Cargo.toml are inline in braces, so only [package] matches.
      - name: Tag and manifest versions agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          conf=$(jq -r .version app/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version app/package.json)
          crate=$(grep -m1 '^version = ' app/src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME tauri.conf.json=$conf package.json=$pkg Cargo.toml=$crate"
          fail=0
          if [ "$GITHUB_REF_NAME" != "v$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf" >&2
            echo "Bundle filenames come from the config, so this release would ship" >&2
            echo "hdl-schemview_${conf}_* assets under the $GITHUB_REF_NAME tag." >&2
            fail=1
          fi
          if [ "$pkg" != "$conf" ] || [ "$crate" != "$conf" ]; then
            echo "::error::manifest versions disagree — tauri.conf.json=$conf app/package.json=$pkg app/src-tauri/Cargo.toml=$crate" >&2
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Bump all three to match the tag, or retag. See docs/releasing.md." >&2
            exit 1
          fi

      - name: Install Tauri Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
        working-directory: core

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        working-directory: app
        run: npm install

      # Vendored into the bundle so installing needs no network and no admin
      # rights — the whole point of tier 1. Cached: it is ~180 MB and pinned.
      #
      # The fixed-version runtime is distributed as a .cab behind a per-release
      # URL from https://developer.microsoft.com/microsoft-edge/webview2/ —
      # there is no stable "latest" endpoint to hardcode, so the exact URL is a
      # repo variable (Settings → Variables → WEBVIEW2_CAB_URL) and is pinned
      # deliberately: the runtime version is part of what this bundle ships.
      - name: Cache WebView2 fixed runtime
        if: runner.os == 'Windows'
        id: webview2
        uses: actions/cache@v4
        with:
          path: app/src-tauri/webview2-runtime
          key: webview2-fixed-${{ hashFiles('app/src-tauri/tauri.offline.conf.json') }}-${{ vars.WEBVIEW2_CAB_URL }}

      - name: Fetch WebView2 fixed runtime
        if: runner.os == 'Windows' && steps.webview2.outputs.cache-hit != 'true'
        env:
          CAB_URL: ${{ vars.WEBVIEW2_CAB_URL }}
        run: |
          if [ -z "$CAB_URL" ]; then
            echo "::error::WEBVIEW2_CAB_URL repo variable is not set." >&2
            echo "The offline Windows bundle vendors a pinned WebView2 fixed-version" >&2
            echo "runtime. Get the .cab URL from" >&2
            echo "  https://developer.microsoft.com/microsoft-edge/webview2/ (Fixed Version)" >&2
            echo "and set it as the WEBVIEW2_CAB_URL repository variable." >&2
            echo "See app/README.md — Distribution / offline install." >&2
            exit 1
          fi
          curl -fsSL -o wv2.cab "$CAB_URL"
          mkdir -p wv2
          # Call the Windows cab extractor by FULL PATH. This step runs under Git
          # Bash, where a bare `expand` resolves to /usr/bin/expand — GNU
          # coreutils' tabs-to-spaces filter — which rejects -F: with
          # "expand: unknown option -- F" and takes the whole job down.
          "${SYSTEMROOT:-C:/Windows}/System32/expand.exe" wv2.cab '-F:*' wv2/ >/dev/null
          # The cab expands to a single versioned directory
          # (Microsoft.WebView2.FixedVersionRuntime.<ver>.x64); normalize the name
          # so tauri.offline.conf.json can reference a stable path.
          inner=$(find wv2 -maxdepth 1 -mindepth 1 -type d | head -1)
          mv "$inner" app/src-tauri/webview2-runtime

      # `targets: "all"` would also attempt .rpm on Ubuntu, which can fail and
      # take the job down — name the bundles explicitly instead. AppImage is the
      # supported isolated-machine artifact; .deb needs repo access.
      - name: Bundle
        working-directory: app
        env:
          # Stamped into the metrics file's `build` row by
          # scale_bench::collect::build_provenance (an `option_env!`, so it must
          # be set at *compile* time). A packaged run has no git checkout and no
          # toolchain, so without this the file carries no provenance at all.
          SVX_BUILD_REV: ${{ github.sha }}
        run: |
          case "${{ runner.os }}" in
            Windows) npm run tauri build -- --config tauri.offline.conf.json --bundles nsis ;;
            Linux)   npm run tauri build -- --bundles appimage,deb ;;
            macOS)   npm run tauri build -- --bundles app,dmg ;;
          esac

      # Tier 1's exit criterion, against the real artifact: copy one file to a
      # machine with no toolchain and produce a metrics file. `--bench` is
      # headless, so it needs no display here.
      #
      # This is the *only* check of the self re-exec inside a FUSE-mounted
      # squashfs — `current_exe()` there is /tmp/.mount_XXXX/usr/bin/<app>, and
      # re-execing it bypasses AppRun (the child relies on inheriting the env
      # AppRun exported). Note libfuse2 must be installed and the AppImage run
      # natively: APPIMAGE_EXTRACT_AND_RUN=1 would make current_exe() a plain
      # directory, i.e. pass without testing the case in question.
      - name: AppImage self re-exec smoke
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libfuse2t64
          app=$(find app/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          test -n "$app" || { echo "::error::no AppImage was produced"; exit 1; }
          chmod +x "$app"
          "$app" --bench --bases golden --out "$RUNNER_TEMP/appimage-bench.md"
          grep -q 'Single-shot run' "$RUNNER_TEMP/appimage-bench.md"
          grep -q 'hdl-schemview --bench' "$RUNNER_TEMP/appimage-bench.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hdl-schemview-bundle-${{ matrix.os }}
          path: app/src-tauri/target/release/bundle/**
          retention-days: 14
          if-no-files-found: warn

  # Durable delivery for the artifacts `bundle` already produced (#248). Actions
  # artifacts expire after 14 days, live behind the Actions UI, and carry no
  # integrity check — the wrong vehicle for a ~200 MB installer that gets
  # hand-carried onto a machine with no network (ADR 0009).
  #
  # ONE aggregating job, not per-matrix-leg uploads: three legs racing on
  # `gh release create` would fight over creating the same release. `needs:` on a
  # fail-fast:false matrix also means a single failed OS leg skips this job
  # entirely — no partial releases.
  release:
    name: Publish draft release
    needs: [build, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Job level on purpose. The workflow default stays `contents: read`, so
    # `build` and `bundle` — which run on every PR — never hold a write token.
    permissions:
      contents: write
    steps:
      # No checkout: nothing here needs the repo, and GH_REPO gives `gh` its
      # target without a git remote to infer one from.
      - uses: actions/download-artifact@v4
        with:
          path: dist

      # The artifacts are whole `bundle/**` trees — macOS's .app alone is a
      # directory of thousands of files — so select the installers rather than
      # uploading everything. Flattening also makes SHA256SUMS carry bare
      # basenames matching the downloaded assets, which is the point of shipping
      # it: on an isolated machine, "did this arrive intact" has no other answer.
      - name: Stage installers + checksums
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.exe' -o -name '*.AppImage' \
            -o -name '*.deb' -o -name '*.dmg' \) -exec cp {} assets/ \;
          if [ -z "$(ls -A assets)" ]; then
            echo "::error::no installer artifacts found in the bundle uploads" >&2
            exit 1
          fi
          cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Draft, not published: macOS is unverified end-to-end (ADR 0009), so
      # auto-publishing a .dmg nobody has opened would overclaim. A human checks
      # the assets and publishes. See docs/releasing.md.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
            --title "$GITHUB_REF_NAME" assets/*
