<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hdl-schemview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <select id="load-mode" title="Design input: a designlist (.f) elaborated on load (default), or a pre-elaborated model JSON">
        <option value="filelist">designlist (.f)</option>
        <option value="model">model JSON</option>
      </select>
      <input id="model" placeholder="model JSON path" />
      <input id="filelist" placeholder="designlist (.f) path" class="hidden" />
      <input id="top" placeholder="top module" class="hidden" />
      <input id="incdir" placeholder="+incdir dirs (optional, ;-separated)" class="hidden" />
      <input id="hlssrc" placeholder="C/C++ sources or dirs (optional, ;-separated)" class="hidden" />
      <input id="trace" placeholder="trace path" />
      <input id="srcroot" placeholder="source root" />
      <button id="load">Load</button>
      <span id="status"></span>
      <!-- Reveal + focus the on-demand views (#99): the default layout opens with
           source + status; these bring the schematic / waveform tab forward. -->
      <button id="show-schematic" title="Show the schematic view">Show schematic</button>
      <button id="show-waveform" title="Show the waveform view">Show waveform</button>
    </header>
    <div id="breadcrumb"></div>
    <main id="panes">
      <section id="hier-pane" class="pane">
        <h2>Hierarchy</h2>
        <div id="hierarchy" class="tree"></div>
      </section>
      <div id="col-splitter" title="Drag to resize the tree pane"></div>
      <!-- Top-right tab group (#99): source ↔ schematic, source active by default.
           The tab bar is the pane header; each tab's own controls (source path,
           zoom bar) live in a .tab-aux shown only while that tab is active. -->
      <section id="content" class="tab-group">
        <div class="tabbar" role="tablist">
          <button class="tab active" data-panel="source-pane" role="tab" aria-selected="true">Source</button>
          <button class="tab" data-panel="csrc-pane" role="tab" aria-selected="false" hidden>C/C++ source</button>
          <button class="tab" data-panel="schematic-pane" role="tab" aria-selected="false" hidden>Schematic</button>
          <button class="tab" data-panel="settings-pane" role="tab" aria-selected="false">Settings</button>
          <span class="tab-aux" data-panel="source-pane"><span id="source-path"></span></span>
          <!-- C/C++ source pane (#159): a file picker to switch between the HLS C sources. -->
          <span class="tab-aux" data-panel="csrc-pane" hidden>
            <select id="csrc-file" title="C/C++ source file" aria-label="C/C++ source file"></select>
          </span>
          <span class="tab-aux" data-panel="schematic-pane" hidden>
            <span id="zoombar" title="Zoom (Ctrl/⌘ + scroll over the schematic)">
              <button id="zoom-out" aria-label="Zoom out">−</button>
              <button id="zoom-reset" title="Fit schematic to view (Ctrl/⌘+0)" aria-label="Fit schematic to view">100%</button>
              <button id="zoom-in" aria-label="Zoom in">+</button>
            </span>
            <button id="pop-schematic" class="pop-btn" title="Open the schematic in its own window (#18)" aria-label="Detach schematic to its own window">⇱</button>
          </span>
        </div>
        <section id="source-pane" class="pane tab-panel active">
          <div id="source"></div>
        </section>
        <!-- C/C++ source pane (#159): shows the HLS high-level source. Reuses the
             same line-list rendering as the RTL pane; clicking a line cross-probes
             through the provenance map to the generated RTL (and schematic/waveform). -->
        <section id="csrc-pane" class="pane tab-panel">
          <div id="csrc" class="source"></div>
        </section>
        <section id="schematic-pane" class="pane tab-panel">
          <div id="schematic"></div>
          <!-- Signal-tracing palette (#219): press `a` over the schematic to search the
               current scope's signals and trace one (append to waveform). Hidden until
               opened; Esc closes. The analogue of the waveform pane's picker (#171),
               keyed to the schematic's active scope. -->
          <div id="schem-palette" hidden>
            <input
              id="schem-palette-input"
              type="text"
              placeholder="Trace a signal in this scope…  (Esc to close)"
              aria-label="Search signals in the schematic's current scope"
              role="combobox"
              aria-expanded="true"
              aria-controls="schem-palette-list"
              aria-autocomplete="list"
              autocomplete="off"
              spellcheck="false"
            />
            <div id="schem-palette-list" role="listbox" aria-label="Signals in scope"></div>
          </div>
        </section>
        <!-- Preferences (#17): the first surface of the Phase 6 config system.
             Folds in the theme toggle and makes the excluded-scopes list editable. -->
        <section id="settings-pane" class="pane tab-panel">
          <div id="settings">
            <label class="setting-row">
              <span class="setting-label">Theme</span>
              <select id="set-theme" title="Schematic / UI colour theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
            <label class="setting-row">
              <span class="setting-label">Excluded scopes</span>
              <input
                id="set-excluded"
                type="text"
                placeholder="TOP, tb, soc_pkg"
                title="Scopes skipped when a design is loaded (comma / space separated); applied on the next load"
              />
            </label>
            <label class="setting-row">
              <span class="setting-label">Gate-level schematic</span>
              <input
                id="set-gate-level"
                type="checkbox"
                title="Dissolve each drilled combinational block into gate/mux glyphs (#157); needs a model elaborated with --gate-level to show primitives"
              />
            </label>
          </div>
        </section>
      </section>
      <div id="row-splitter" title="Drag to resize the bottom pane"></div>
      <!-- Bottom tab group (#99): status/log ↔ waveform, status active by default.
           The status pane is an empty placeholder here; its log content lands in
           #4c. The waveform tab keeps the marker readout / unit / zoom controls. -->
      <section id="bottom-group" class="tab-group">
        <div class="tabbar" role="tablist">
          <button class="tab active" data-panel="status-pane" role="tab" aria-selected="true">Status</button>
          <button class="tab" data-panel="wave-pane" role="tab" aria-selected="false" hidden>Waveform</button>
          <span class="tab-aux" data-panel="wave-pane" hidden>
            <span id="wave-readout"></span>
            <select id="wave-unit" title="Time display unit">
              <option value="ps">ps</option>
              <option value="ns">ns</option>
              <option value="us">µs</option>
              <option value="ms">ms</option>
            </select>
            <span id="wave-zoombar" title="Zoom (Ctrl/⌘ + scroll over the tracks); drag to pan">
              <button id="wave-zoom-out" aria-label="Zoom out">−</button>
              <button id="wave-zoom-reset" title="Fit waveform to data" aria-label="Fit waveform to data">⤢</button>
              <button id="wave-zoom-in" aria-label="Zoom in">+</button>
            </span>
            <button id="wave-pick-btn" class="pop-btn" aria-expanded="false" title="Show/hide the signal picker (Ctrl/⌘+B)" aria-label="Toggle the signal picker">☰ Signals</button>
            <button id="load-trace" class="pop-btn" title="Load a trace (VCD/FST/GHW) into this waveform pane, keeping the current design (#170)" aria-label="Load a trace into this waveform pane">Load trace…</button>
            <button id="pop-waveform" class="pop-btn" title="Open the waveform in its own window (#18)" aria-label="Detach waveform to its own window">⇱</button>
          </span>
        </div>
        <section id="status-pane" class="pane tab-panel active">
          <div id="status-log"></div>
        </section>
        <section id="wave-pane" class="pane tab-panel">
          <!-- Per-pane signal picker (#171), GTKWave-SST style: the scope tree over the
               signals in the selected scope. It lives inside #wave-pane rather than the
               window's #hier-pane column, so every waveform pop-out gets one for free —
               body.detached-waveform already hands #bottom-group the whole window, so no
               detached-grid surgery is needed. Collapsed by default; toggled by
               #wave-pick-btn or Ctrl/⌘+B. (This is the *signal* picker; #picker is the
               cross-probe alternatives list.) -->
          <div id="wave-picker" hidden>
            <div id="wave-picker-tree" class="tree"></div>
            <div id="wave-picker-sigs"></div>
          </div>
          <div id="wave-list"></div>
        </section>
      </section>
    </main>
    <div id="picker"></div>
    <div id="ctxmenu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
