<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hdl-schemview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <input id="model" placeholder="model JSON path" />
      <input id="trace" placeholder="trace path" />
      <input id="srcroot" placeholder="source root" />
      <button id="load">Load</button>
      <span id="status"></span>
      <span id="zoombar" title="Zoom (Ctrl/⌘ + scroll over the schematic)">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-reset" title="Fit schematic to view (Ctrl/⌘+0)" aria-label="Fit schematic to view">100%</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </span>
      <button id="theme-toggle" title="Toggle light / dark theme" aria-label="Toggle theme">◐</button>
    </header>
    <div id="breadcrumb"></div>
    <main id="panes">
      <section id="schematic-pane" class="pane">
        <h2>Schematic</h2>
        <div id="schematic"></div>
      </section>
      <section id="right">
        <section id="source-pane" class="pane">
          <h2>Source <span id="source-path"></span></h2>
          <div id="source"></div>
        </section>
        <section id="wave-pane" class="pane">
          <h2>Waveform</h2>
          <div id="wave-list"></div>
        </section>
      </section>
    </main>
    <div id="picker"></div>
    <div id="ctxmenu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
