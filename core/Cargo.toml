[workspace]
resolver = "2"
members = [
    "crates/model",
    "crates/ingest",
    "crates/wave",
    "crates/matcher",
    "crates/xprobe",
    "crates/schematic",
    "crates/gui",
    "crates/cli",
    "crates/scale-bench",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chuanseng-ng/hdl-schemview"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# wellen: pure-Rust VCD/FST/GHW reader with lazy per-signal loading.
wellen = "0.25"
# rust-lapper: interval tree for the source-range reverse index (src_index).
rust-lapper = "1.3"
# rkyv: zero-copy archive used as a derived on-disk load cache (#21, ADR 0003).
rkyv = "0.8"
# memmap2: mmap the rkyv cache on load (already transitive via wellen).
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
# criterion: statistical benchmark harness for the scale-bench crate (dev-only).
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
svxprobe-model = { path = "crates/model" }
svxprobe-ingest = { path = "crates/ingest" }
svxprobe-wave = { path = "crates/wave" }
svxprobe-matcher = { path = "crates/matcher" }
svxprobe-xprobe = { path = "crates/xprobe" }
svxprobe-schematic = { path = "crates/schematic" }
svxprobe-gui = { path = "crates/gui" }
