[project]
name = "svxprobe-elaborate"
version = "0.0.0"
description = "hdl-schemview elaboration harness: pyslang -> Node-model JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Pin pyslang exactly: the serialized model is an integration contract, and the
# slang AST surface can shift between releases.
dependencies = [
    "pyslang==11.0.0",
    "jsonschema>=4.21,<5",
]

[project.scripts]
svxprobe-elaborate = "svxprobe_elaborate.elaborate:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["svxprobe_elaborate"]
# hatchling sweeps the schema in anyway as a non-Python file under `packages`, but
# state it: `validate.py` resolves it through importlib.resources, so a wheel built
# without it fails at call time rather than at build time.
artifacts = ["svxprobe_elaborate/schema/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
